<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quest SOP — Room QR Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FAF5EC;
      --ink: #2B2722;
      --terracotta: #C4622D;
      --line: #E4DACA;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: "Hanken Grotesk", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(43,39,34,0.10);
    }
    h1 {
      font-family: "Fraunces", serif;
      font-weight: 500;
      font-size: 24px;
      margin-bottom: 4px;
    }
    .sub { font-size: 13px; color: #6B6357; margin-bottom: 24px; word-break: break-all; }
    #qr {
      display: inline-block;
      padding: 16px;
      background: #fff;
      border-radius: 18px;
    }
    .actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button {
      font-family: inherit;
      font-weight: 600;
      font-size: 14px;
      border: none;
      border-radius: 999px;
      padding: 11px 20px;
      cursor: pointer;
    }
    .btn-primary { background: var(--terracotta); color: #fff; }
    .btn-secondary { background: var(--cream); color: var(--ink); border: 1px solid var(--line); }
    .btn-primary:active, .btn-secondary:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Quest Sydney Olympic Park</h1>
    <p class="sub" id="urlLabel"></p>
    <div id="qr"></div>
    <div class="actions">
      <button class="btn-primary" id="dlPng">Download PNG</button>
      <button class="btn-secondary" id="dlSvg">Download SVG</button>
    </div>
  </div>

  <script src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
  <script>
    const TARGET_URL = "https://quest-sop-room-production.up.railway.app/";
    document.getElementById("urlLabel").textContent = TARGET_URL;

    // Quest-style "Q" mark used as the centre logo (terracotta on white).
    const logoSvg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="60" fill="#ffffff"/>
        <circle cx="60" cy="60" r="52" fill="#C4622D"/>
        <text x="60" y="82" font-family="Fraunces, Georgia, serif" font-size="64"
              font-weight="600" fill="#ffffff" text-anchor="middle">Q</text>
      </svg>`;
    const logoUrl = "data:image/svg+xml;base64," + btoa(logoSvg);

    const qr = new QRCodeStyling({
      width: 320,
      height: 320,
      type: "svg",
      data: TARGET_URL,
      image: logoUrl,
      qrOptions: { errorCorrectionLevel: "H" },
      imageOptions: { crossOrigin: "anonymous", margin: 6, imageSize: 0.28 },
      dotsOptions: { color: "#2B2722", type: "rounded" },
      cornersSquareOptions: { color: "#C4622D", type: "extra-rounded" },
      cornersDotOptions: { color: "#C4622D", type: "dot" },
      backgroundOptions: { color: "#ffffff" }
    });

    qr.append(document.getElementById("qr"));

    document.getElementById("dlPng").onclick = () =>
      qr.download({ name: "quest-sop-room-qr", extension: "png" });
    document.getElementById("dlSvg").onclick = () =>
      qr.download({ name: "quest-sop-room-qr", extension: "svg" });
  </script>
</body>
</html>
